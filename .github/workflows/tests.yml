name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Stockfish 19 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-windows-x86-64-universal.zip' -OutFile "$env:RUNNER_TEMP\stockfish.zip"
          Expand-Archive "$env:RUNNER_TEMP\stockfish.zip" -DestinationPath engine -Force
      - name: Stockfish 19 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fL --retry 3 https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz -o /tmp/stockfish.tar.gz
          tar -xzf /tmp/stockfish.tar.gz -C engine
      - run: python -m unittest discover -s tests -v
      - name: HTTP start, model selection and clean shutdown
        run: python scripts/check_server.py
